# Server Port
server.port=8080

# Connect Gateway to Eureka Discovery Server
#eureka.client.serviceUrl.defaultZone=http://localhost:8761/eureka/

spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowed-origins[0]=http://localhost:5173
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowed-origins[1]=http://34.93.147.117
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowed-methods[0]=GET
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowed-methods[1]=POST
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowed-methods[2]=PUT
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowed-methods[3]=DELETE
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowed-methods[4]=OPTIONS
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowed-headers[0]=*
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allow-credentials=true



# Enable Automatic Routing based on Eureka Registered Microservices
#spring.cloud.gateway.discovery.locator.enabled=true
#spring.cloud.gateway.discovery.locator.lower-case-service-id=true

spring.cloud.gateway.server.webflux.routes[0].id=jdm-expo-vehicle-service
spring.cloud.gateway.server.webflux.routes[0].uri=lb://JDM-EXPO-VEHICLE-SERVICE
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/api/v1/vehicles/**
spring.cloud.gateway.server.webflux.routes[1].id=jdm-expo-order-service
spring.cloud.gateway.server.webflux.routes[1].uri=lb://JDM-EXPO-ORDER-SERVICE
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/api/v1/orders/**
spring.cloud.gateway.server.webflux.routes[2].id=jdm-expo-media-service
spring.cloud.gateway.server.webflux.routes[2].uri=lb://JDM-EXPO-MEDIA-SERVICE
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/api/v1/media/**

# Actuator & Gateway Route Exposure
management.endpoints.web.exposure.include=health,info,metrics,gateway
management.endpoint.health.show-details=always


# Eureka Client Configuration
eureka.client.serviceUrl.defaultZone=http://vm-node-a.platform:8761/eureka/, http://vm-node-b.platform:8761/eureka/, http://vm-node-c.platform:8761/eureka/

#eureka.client.serviceUrl.defaultZone=http://localhost:8761/eureka/

# Spring Boot Actuator Configuration
management.endpoints.web.exposure.include=*

# Logging Levels
logging.level.lk.ijse.eca=DEBUG
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=DEBUG
